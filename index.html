      { brand: 'bk', brandName: "Burger King", code: 'BKROYAL', title: '20% Off Fiery Chicken', desc: 'Discount on Fiery Chicken Burger Meals.', img: 'https://images.unsplash.com/photo-1586190848861-99aa4a171e90?w=600&auto=format&fit=crop&q=80', badgeColor: 'bg-yellow-600', btnColor: 'bg-yellow-600 hover:bg-yellow-700' },
      { brand: 'bk', brandName: "Burger King", code: 'BKNIGHT', title: 'Flat 30% Off Night Menu', desc: 'Valid on orders placed post 10 PM.', img: 'https://images.unsplash.com/photo-1571091718767-18b5b1457add?w=600&auto=format&fit=crop&q=80', badgeColor: 'bg-yellow-600', btnColor: 'bg-yellow-600 hover:bg-yellow-700' }
    ];

    let currentBrand = 'all';

    function renderCoupons(items) {
      const grid = document.getElementById('coupon-grid');
      grid.innerHTML = '';

      if(items.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500">No matching coupon codes found.</div>`;
        return;
      }

      items.forEach(c => {
        const card = document.createElement('article');
        card.className = 'bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden shadow-xl flex flex-col justify-between hover:border-slate-700 transition duration-300';
        card.innerHTML = `
          <div>
            <div class="relative h-40 w-full overflow-hidden">
              <img src="${c.img}" alt="${c.title}" class="w-full h-full object-cover" />
              <span class="absolute top-3 left-3 ${c.badgeColor} text-xs font-bold px-2.5 py-1 rounded-md shadow">${c.brandName}</span>
            </div>
            <div class="p-5">
              <h3 class="text-lg font-bold text-white mb-1">${c.title}</h3>
              <p class="text-xs text-slate-400">${c.desc}</p>
            </div>
          </div>
          <div class="p-5 pt-0">
            <button onclick="copyCode('${c.code}', this)" class="w-full py-2.5 ${c.btnColor} font-bold rounded-xl flex items-center justify-center gap-2 transition text-sm active:scale-95">
              <i class="fa-regular fa-copy"></i> Copy <span class="bg-black/20 px-2 py-0.5 rounded text-xs tracking-wider">${c.code}</span>
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function setBrand(brand) {
      currentBrand = brand;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        if (btn.getAttribute('data-brand') === brand) {
          btn.className = 'tab-btn active px-4 py-2.5 rounded-xl text-sm font-bold transition flex items-center gap-2 bg-amber-500 text-slate-950';
        } else {
          btn.className = 'tab-btn px-4 py-2.5 rounded-xl text-sm font-bold transition flex items-center gap-2 text-slate-400 hover:text-white hover:bg-slate-800';
        }
      });
      filterCoupons();
    }

    function filterCoupons() {
      const searchTerm = document.getElementById('search-input').value.toLowerCase();
      const filtered = couponsData.filter(c => {
        const matchesBrand = (currentBrand === 'all' || c.brand === currentBrand);
        const matchesSearch = c.title.toLowerCase().includes(searchTerm) || 
                              c.code.toLowerCase().includes(searchTerm) || 
                              c.desc.toLowerCase().includes(searchTerm) ||
                              c.brandName.toLowerCase().includes(searchTerm);
        return matchesBrand && matchesSearch;
      });
      renderCoupons(filtered);
    }

    function copyCode(code, btn) {
      navigator.clipboard.writeText(code);
      const originalHTML = btn.innerHTML;
      btn.innerHTML = `<i class="fa-solid fa-check"></i> Copied!`;
      btn.classList.add('bg-emerald-600');
      setTimeout(() => {
        btn.innerHTML = originalHTML;
        btn.classList.remove('bg-emerald-600');
      }, 2000);
    }

    // Initial Load
    renderCoupons(couponsData);
  </script>
</body>
</html>
